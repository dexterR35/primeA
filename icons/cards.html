<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Gallery</title>
<!--
  Standalone gallery: search + cards + lightbox, nothing else.
  All styling lives in _gallery/cards.css (every class prefixed .gal-).

  To reuse this in another page you need three things:
    1. <link rel="stylesheet" href="_gallery/cards.css">
    2. the .gal-bar / .gal-grid / .gal-lb markup below
    3. the script at the bottom (it only needs an array of image objects)

  One card is this shape - copy it if you want to hand-write cards instead of
  generating them:

    <div class="gal-card">
      <div class="gal-shot">
        <span class="gal-badge">Contact sheet</span>
        <img src="images/gold/gold icons.png" alt="Classic Slot Core">
      </div>
      <div class="gal-body">
        <h3>Classic Slot Core</h3>
        <div class="gal-note">Baseline family: ruby 7, bell, cherries…</div>
        <div class="gal-tags"><span class="gal-tag">classic slots</span></div>
      </div>
      <footer class="gal-foot">
        <span class="gal-dot"></span>
        <span class="gal-name">gold icons.png</span>
        <span>1536×1024</span>
      </footer>
    </div>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_gallery/cards.css">
<style>
  /* page chrome only - not part of the component */
  body{margin:0;background:var(--gal-bg);color:var(--gal-ink);font-family:var(--gal-font)}
  .page{max-width:1500px;margin:0 auto;padding:34px 26px 90px}
  .page h1{margin:0 0 6px;font:600 26px/1.2 var(--gal-font);letter-spacing:-.01em}
  .page .lede{margin:0 0 26px;color:var(--gal-ink-2);font-size:14px}
  @media(max-width:700px){.page{padding:22px 16px 70px}}
</style>
</head>
<body>

<div class="page">
  <h1>Icon gallery</h1>
  <p class="lede" id="lede"></p>

  <!-- ---------- toolbar ---------- -->
  <div class="gal-bar">
    <div class="gal-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search titles, notes, filenames…" autocomplete="off">
    </div>
    <span class="gal-lbl">Set</span>
    <div class="gal-seg" id="setseg"></div>
    <span class="gal-lbl">Type</span>
    <div class="gal-seg" id="kindseg">
      <button data-kind="all" aria-pressed="true">All</button>
      <button data-kind="sheet" aria-pressed="false">Contact sheets</button>
      <button data-kind="single" aria-pressed="false">Single icons</button>
    </div>
  </div>

  <!-- ---------- grid ---------- -->
  <div class="gal-grid" id="grid"></div>
  <div class="gal-empty" id="empty" hidden>Nothing matches that search.</div>
</div>

<!-- ---------- lightbox ---------- -->
<div class="gal-lb" id="lb" data-open="false" role="dialog" aria-modal="true">
  <div class="gal-stage" id="stage" data-zoom="false">
    <button class="gal-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="gal-nav prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <button class="gal-nav next" id="lbNext" aria-label="Next">&#8250;</button>
    <img id="lbImg" alt="">
  </div>
  <div class="gal-lbfoot">
    <div class="gal-meta">
      <h3 id="lbTitle"></h3>
      <p id="lbNote"></p>
      <div class="gal-path" id="lbPath"></div>
    </div>
    <a class="gal-btn" id="lbOpen" target="_blank" rel="noopener">Open full size</a>
    <a class="gal-btn" id="lbDl" download>Download</a>
  </div>
</div>

<script src="_gallery/data.js"></script>
<script>
/* ---------------------------------------------------------------------------
   The component needs nothing but an array of objects shaped like this:

     { file, thumb, title, note, kind, tags[], w, h, alpha, mb, set }

   Here they come from _gallery/data.js (written by _gallery/build.py). Swap
   this block for your own array and the rest of the file works unchanged.
--------------------------------------------------------------------------- */
const SETS = window.GALLERY.gpts;
const ALL = SETS.flatMap(g => g.images.map(i => ({ ...i, set: g.id, setName: g.name })));

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = p => encodeURI(p).replace(/#/g, '%23').replace(/\?/g, '%3F');

let set = 'all', kind = 'all', query = '', shown = [];

/* set filter buttons, built from the data */
$('#setseg').innerHTML =
  '<button data-set="all" aria-pressed="true">All</button>' +
  SETS.map(g => `<button data-set="${g.id}" aria-pressed="false">${esc(g.name)}</button>`).join('');
$('#lede').textContent =
  ALL.length + ' reference images across ' + SETS.length + ' sets. Click a card for full size.';

function seg(box, attr, set_) {
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    set_(b.dataset[attr]);
    [...box.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  };
}
seg($('#setseg'), 'set', v => set = v);
seg($('#kindseg'), 'kind', v => kind = v);
$('#q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

function render() {
  shown = ALL.filter(i => {
    if (set !== 'all' && i.set !== set) return false;
    if (kind !== 'all' && i.kind !== kind) return false;
    if (query) {
      const hay = (i.title + ' ' + i.note + ' ' + i.file + ' ' + i.tags.join(' ')).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
  $('#empty').hidden = shown.length > 0;
  $('#grid').innerHTML = shown.map((i, n) => `
    <div class="gal-card" data-n="${n}">
      <div class="gal-shot">
        <span class="gal-badge">${i.kind === 'sheet' ? 'Contact sheet' : 'Single icon'}</span>
        <img loading="lazy" src="${url(i.thumb)}" alt="${esc(i.title)}">
      </div>
      <div class="gal-body">
        <h3>${esc(i.title)}</h3>
        <div class="gal-note">${esc(i.note || '')}</div>
        <div class="gal-tags">${i.tags.map(t => `<span class="gal-tag">${esc(t)}</span>`).join('')}</div>
      </div>
      <footer class="gal-foot">
        <span class="gal-dot"></span>
        <span class="gal-name" title="${esc(i.file)}">${esc(i.file.split('/').pop())}</span>
        <span>${i.w}×${i.h}</span>
        <span>${i.alpha ? 'RGBA' : 'RGB'}</span>
      </footer>
    </div>`).join('');
}

/* ---------- lightbox ---------- */
let idx = 0;
function open_(n) {
  idx = (n + shown.length) % shown.length;
  const d = shown[idx];
  $('#lbImg').src = url(d.file);
  $('#lbImg').alt = d.title;
  $('#lbTitle').textContent = d.title;
  $('#lbNote').textContent = (d.note || '') + (d.aliases && d.aliases.length ? '  ·  Duplicate file: ' + d.aliases.join(', ') : '');
  $('#lbPath').textContent = d.file + '  ·  ' + d.w + '×' + d.h + '  ·  ' + d.mb + ' MB  ·  ' + (d.alpha ? 'transparent' : 'opaque');
  $('#lbOpen').href = $('#lbDl').href = url(d.file);
  $('#stage').dataset.zoom = 'false';
  $('#lb').dataset.open = 'true';
  document.body.style.overflow = 'hidden';
}
function close_() { $('#lb').dataset.open = 'false'; document.body.style.overflow = ''; }

$('#grid').onclick = e => { const c = e.target.closest('.gal-card'); if (c) open_(+c.dataset.n); };
$('#lbClose').onclick = close_;
$('#lbPrev').onclick = e => { e.stopPropagation(); open_(idx - 1); };
$('#lbNext').onclick = e => { e.stopPropagation(); open_(idx + 1); };
$('#lbImg').onclick = e => { e.stopPropagation(); const s = $('#stage'); s.dataset.zoom = s.dataset.zoom === 'true' ? 'false' : 'true'; };
$('#lb').onclick = e => { if (e.target.id === 'lb' || e.target.id === 'stage') close_(); };
addEventListener('keydown', e => {
  if ($('#lb').dataset.open !== 'true') return;
  if (e.key === 'Escape') close_();
  if (e.key === 'ArrowLeft') open_(idx - 1);
  if (e.key === 'ArrowRight') open_(idx + 1);
});

render();
</script>
</body>
</html>
